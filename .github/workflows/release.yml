name: release
# Publishes the bundled CLI to npm on a version tag, so `npx vibetrack` works for everyone.
# Requires an NPM_TOKEN repo secret (npm automation token with publish rights).
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install build tool + build bundle
        run: npm install --no-save esbuild && npm run build
      - name: Verify the bundle runs
        run: node dist/vibetracker.js providers >/dev/null
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
